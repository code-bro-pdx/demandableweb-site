  <rect x="20" y="25" width="9" height="12" rx="4.5" fill="none" stroke="#4FA9A2" stroke-width="2.6"/>
  <rect x="35" y="25" width="9" height="12" rx="4.5" fill="none" stroke="#4FA9A2" stroke-width="2.6"/>
